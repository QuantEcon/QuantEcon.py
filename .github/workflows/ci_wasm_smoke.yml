name: WASM smoke suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ------------------------------------------------------------------
  # Job 1 — native Python.  Fast gate: ensures the suite itself is
  # correct and all 16 tests pass before the slow WASM build starts.
  # ------------------------------------------------------------------
  native:
    name: Smoke suite (native)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Cache conda
      uses: actions/cache@v6
      env:
        CACHE_NUMBER: 0
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-3.13-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}

    - uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        miniforge-version: latest
        environment-file: environment.yml
        python-version: "3.13"
        auto-activate-base: false
        use-only-tar-bz2: true
        activate-environment: qe

    - name: Run smoke suite (native)
      shell: bash -l {0}
      run: pytest ci/wasm/smoke_test.py -v

  # ------------------------------------------------------------------
  # Job 2 — Emscripten / JupyterLite.
  # Builds a real JupyterLite site from emscripten-forge packages
  # (xeus-python WASM kernel + numba + quantecon), then drives it
  # headlessly with Playwright to verify the stack end-to-end.
  # ------------------------------------------------------------------
  wasm:
    name: Smoke suite (Emscripten / JupyterLite)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Cache JupyterLite build output
      uses: actions/cache@v6
      with:
        path: _site
        key: jupyterlite-site-${{ hashFiles('ci/wasm/environment.yml') }}

    - name: Install JupyterLite build tools
      run: |
        pip install \
          "jupyterlite-core>=0.4" \
          "jupyterlite-xeus>=4.5" \
          pytest \
          pytest-playwright

    - name: Install Playwright browser
      run: python -m playwright install --with-deps chromium

    - name: Build JupyterLite site
      run: |
        jupyter lite build \
          --XeusAddon.environment_file=ci/wasm/environment.yml \
          --output-dir=_site

    - name: Start local server
      run: python -m http.server 8000 --directory _site &

    - name: Run Playwright smoke tests (Emscripten kernel)
      run: |
        pytest ci/wasm/test_jupyterlite.py \
          --browser chromium \
          --timeout=660 \
          -v
