name: conda-build (numba rc/latest)

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
      with:
        auto-update-conda: true
        miniforge-version: latest
        environment-file: environment_np2.yml
        python-version: '3.15'
    - name: Conda info
      shell: bash -l {0}
      run: |
        conda info
        conda list
    - name: Test with pytest
      shell: bash -l {0}
      run: |
        conda install pytest
        pytest
