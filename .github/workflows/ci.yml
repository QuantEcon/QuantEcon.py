name: conda-build

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Name of an existing tag to build and publish to PyPI (for example v0.12.0); branch names and SHAs are rejected"
        required: true
        type: string

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      # one failing job shouldn't cancel the rest of the matrix
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # quoted as strings (bare 3.10 would parse as float 3.1)
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
    - name: Cache conda
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      env:
        CACHE_NUMBER: 0
      with:
        path: ~/conda_pkgs_dir
        key:
          ${{ runner.os }}-${{ matrix.python-version }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}
    - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
      with:
        auto-update-conda: true
        miniforge-version: latest
        environment-file: environment.yml
        python-version: ${{ matrix.python-version }}
        auto-activate-base: false
        use-only-tar-bz2: true
        activate-environment: qe
    - name: Conda info
      shell: bash -l {0}
      run: |
        conda info
        conda list
    - name: flake8 Tests
      shell: bash -l {0}
      run: |
        flake8 --select=F401,F405,E231 quantecon
    - name: Run Tests (pytest)
      shell: bash -l {0}
      run: |
        pytest quantecon

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      statuses: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
    - name: Cache conda
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      env:
        CACHE_NUMBER: 0
      with:
        path: ~/conda_pkgs_dir
        key:
          ${{ runner.os }}-3.13-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('environment.yml') }}
    - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
      with:
        auto-update-conda: true
        miniforge-version: latest
        environment-file: environment.yml
        python-version: "3.13"
        auto-activate-base: false
        use-only-tar-bz2: true
        activate-environment: qe
    - name: Run Tests with coverage
      shell: bash -l {0}
      env:
        # Numba emits coverage for JIT functions at compile time (lowering),
        # which cache=True functions skip when loaded from a warm on-disk
        # cache. Enable JIT coverage and point the cache at a throwaway dir
        # so every jitted function is compiled -- and thus reported -- here.
        # Requires numba >= 0.62 (coverage respects .coveragerc from there on).
        NUMBA_JIT_COVERAGE: "1"
        NUMBA_CACHE_DIR: ${{ runner.temp }}/numba_cache
      run: |
        coverage run -m pytest quantecon
        coverage lcov
    - name: Coveralls
      uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
      # continue-on-error so an upload hiccup can't fail CI
      continue-on-error: true
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # `file` (not the deprecated `path-to-lcov`) is the v2 input
        file: coverage.lcov
        format: lcov

  docs:

    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        # mirrors the Read the Docs build (see .readthedocs.yaml)
        python-version: "3.14"
    - name: Install dependencies
      run: |
        pip install -r docs/rtd-requirements.txt
        pip install .
    - name: Check generated sources are up to date
      # Read the Docs builds the *committed* .rst files and never runs
      # qe_apidoc.py, so regenerating here would pass green while RTD
      # served stale pages. Fail if the committed sources have drifted.
      working-directory: docs
      run: python qe_apidoc.py
    - name: Fail on docs/source drift
      # Check for modified tracked files AND untracked new files: a
      # newly added module makes qe_apidoc.py emit a new .rst, which
      # `git diff` alone would miss.
      run: |
        git diff --exit-code -- docs/source \
          || { echo "::error::docs/source is stale -- run 'cd docs && python qe_apidoc.py' and commit the result"; exit 1; }
        untracked=$(git ls-files --others --exclude-standard docs/source)
        if [ -n "$untracked" ]; then
          echo "::error::qe_apidoc.py generated new uncommitted pages: $untracked -- run 'cd docs && python qe_apidoc.py' and commit the result"
          exit 1
        fi
    - name: Build HTML
      working-directory: docs
      run: sphinx-build -b html source build/html
    - name: Upload built docs
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: docs-html
        path: docs/build/html

  publish:

    name: Publish to PyPi
    needs: [tests]
    if: (github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: PyPI
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # On manual dispatch, check out the input as a fully qualified tag ref: a branch
        # name or SHA cannot resolve, and a missing tag fails here before anything is built.
        ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.ref) || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.x"
    - name: Install flit
      run: |
        # Keep flit and flit_core in the same major series: flit 3.x only requires
        # flit_core>=3.12 with no upper bound, and flit_core 4 (August 2026) dropped
        # the gen_setup.py argument flit 3.x still passes, so an unpinned flit_core
        # breaks `flit build` with a TypeError.
        pip install "flit~=3.12" "flit_core~=3.12"
    - name: Build distribution
      run: |
        flit build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
